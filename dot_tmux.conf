# Enable mouse but try to make scrolling work naturally  
set -g mouse on

# Try to pass through terminal scrollback
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Bind mouse wheel to enter copy-mode and scroll immediately
bind-key -n WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -n WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# Make copy-mode scrolling smooth and exit automatically when at bottom
set -g @scroll-speed-num-lines-per-scroll 3
set -g base-index 1
setw -g mode-keys vi
set -g escape-time 0

# Keep prefix for emergency use only
unbind C-b
set -g prefix C-a

# Disable most window operations (use nvim for windows)
unbind c     # No new windows
unbind n     # No next window  
unbind p     # No previous window
unbind &     # No kill window
unbind ,     # No rename

# Hide status bar completely
set -g status off

# Or if you want minimal status bar:
# set -g status on
# set -g status-position top
# set -g status-style bg=default,fg=colour240
# set -g status-left ''
# set -g status-right ''
# set -g window-status-format ''
# set -g window-status-current-format ''

# Large scrollback
set -g history-limit 50000

# Pass through all keys except prefix
setw -g xterm-keys on

# True color support with OSC 52 compatibility
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable OSC 52 clipboard support
set -g set-clipboard on